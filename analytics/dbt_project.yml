name: analytics

profile: construction_pnl

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  analytics:
    +schema: seeds

models:
  analytics::
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
      +post-hook: "{{ export_parquet() }}"

snapshots:
  analytics::
    +schema: snapshots

vars:
  incremental_lookback_days: 3  # re-merge rows updated in the last N days (late ERP edits)
  reprocess_from_month: null    # e.g. '2026-01-01' to force re-merge from that month
  mes_fechamento: null          # closing month; null = previous month
